plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version = '0.1.0'
group = 'org.flybrain'
base { archivesName = 'flybrain-minecraft' }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'maven.modrinth:carpet:yt9oDFOj'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'flybrain-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}
// Optional isolated compatibility run against an existing modpack's jars.
if (providers.gradleProperty('compatMods').isPresent()) {
    dependencies {
        gametestRuntimeOnly fileTree(dir: providers.gradleProperty('compatMods').get(),
            include: ['*.jar'], exclude: ['fabric-api-*', 'flybrain-*', 'fabric-carpet-*'])
    }
}
